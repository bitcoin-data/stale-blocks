name: Deploy Website

on:
  push:
    branches: [master]
  # TEMPORARY: runs the build on pull requests, without deploying, to test the
  # header tree steps. Remove together with the other TEMPORARY parts below
  # once that's done.
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 ci/generate-website.py

      # The header tree on the dashboard is rendered by a fork-observer
      # instance that runs only for this job: its database is built from
      # block-dn.org and the dataset, and its tree is exported as static
      # files. See ci/fork-observer/README.md.
      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          # The 0xb10c/nix CI builds its packages against this channel and
          # pushes them to its cachix cache. Using the same nixpkgs makes this
          # a download instead of a build.
          nix_path: nixpkgs=channel:nixos-26.05
      - name: Set up the b10c-nixpkgs cachix cache
        uses: cachix/cachix-action@v17
        with:
          name: b10c-nixpkgs
      - name: Build fork-observer
        run: nix-build https://github.com/0xb10c/nix/archive/master.tar.gz -A fork-observer -o fork-observer

      - name: Build the fork-observer database
        run: python3 ci/fork-observer-db.py fork-observer-db/fork-observer.sqlite
      - name: Start fork-observer
        run: |
          CONFIG_FILE=ci/fork-observer/config.toml RUST_LOG=info \
            nohup ./fork-observer/bin/fork-observer > fork-observer.log 2>&1 &
      - name: Export the header tree
        run: python3 ci/fork-observer-site.py
      - name: Stop fork-observer
        if: always()
        run: |
          cat fork-observer.log
          pkill fork-observer || true

      # TEMPORARY: the generated site as a downloadable artifact, to look at
      # what a pull request would deploy. Serve the unzipped directory over
      # HTTP, e.g. with `python3 -m http.server`.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
