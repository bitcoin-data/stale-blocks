<!DOCTYPE html>
<!--
  The header tree, embedded in the dashboard as an iframe. It's a separate
  document because fork-observer's stylesheets restyle the whole page and
  would clash with the dashboard's.

  The tree is drawn by fork-observer's blocktree.js
  (https://github.com/0xB10C/fork-observer), which ci/fork-observer-site.py
  deploys next to this file under static/ together with the data under
  data.json. The script below is the little that fork-observer's main.js does
  on top of that on a live instance and that a snapshot needs: define the
  globals blocktree.js reads, load the data, draw once.
-->
<html class="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="static/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/css/style.css" rel="stylesheet">
  <style>
    body { margin: 0; }
    .viz { height: 100%; }
    .tree-controls { position: absolute; top: 8px; left: 8px; z-index: 2; }
    .tree-legend { position: absolute; bottom: 8px; left: 8px; z-index: 2; }
    .viz-recenter { z-index: 2; }
  </style>
</head>

<body>
  <div class="viz-wrap" style="position: absolute; inset: 0;">
    <div class="tree-controls">
      <select name="orientation" id="orientation" class="form-select form-select-sm" title="orientation"></select>
    </div>
    <svg class="viz" id="drawing-area"></svg>
    <button type="button" class="viz-recenter" id="recenter" title="Recenter on the chain tip" onclick="recenter()">re-center</button>
    <!-- Kept for blocktree.js, which hides it since there is no countdown. -->
    <div id="countdown-display" class="countdown-display" style="display: none"></div>
    <small class="tree-legend">
      <span class="legend-item tip-status-color-background-active">active</span><span class="px-1">main chain tip when the page was generated</span>
      <span class="legend-item tip-status-color-background-valid-headers">valid-headers</span><span class="px-1">stale block, full block in the dataset</span>
      <span class="legend-item tip-status-color-background-headers-only">headers-only</span><span class="px-1">stale block, only the header in the dataset</span>
    </small>
  </div>
  <div id="toast" class="toast-msg"></div>

  <script src="static/js/d3.v7.min.js"></script>
  <script src="static/js/blocktree.js"></script>
  <script>
    // What blocktree.js expects main.js to provide.
    const MINING_ENABLED = false
    const state_stratum_jobs = new Map()
    const state_selected_network_id = 1
    let state_data = { header_infos: [], nodes: [] }

    let toastTimer = null
    function showToast(message) {
      const toast = document.getElementById("toast")
      toast.textContent = message
      toast.classList.add("toast-show")
      clearTimeout(toastTimer)
      toastTimer = setTimeout(() => toast.classList.remove("toast-show"), 1800)
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text)
        .then(() => showToast((label ? label + " " : "") + "copied to clipboard"))
        .catch(() => showToast("could not copy to clipboard"))
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeAllDescriptions()
    })

    fetch("data.json")
      .then(response => response.json())
      .then(data => {
        state_data = data
        draw({ reason: "load", snap: true })
      })
      .catch(console.error)
  </script>
</body>

</html>
